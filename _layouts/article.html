---
layout: default
---
<div class="page-head">
  <div class="wrap page-head__inner">
    <p class="eyebrow eyebrow--lead label u-enter" style="--delay:.08s">Writing &middot; {{ page.date | date: "%-d %B %Y" }}</p>
    <h1 class="page-head__title u-enter" style="--delay:.2s">{{ page.title }}</h1>
    {% if page.standfirst %}<p class="page-head__standfirst u-enter" style="--delay:.34s">{{ page.standfirst }}</p>
    {% endif %}</div>
</div>

<main id="main">

  <section class="stratum stratum--pale">
    <div class="wrap stratum__inner">
      <div class="prose u-reveal" style="--i:0">
{{ content }}
      </div>
    </div>
  </section>

  {% include stratum-cta.html %}

</main>
