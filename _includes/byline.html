<!-- Byline. One author, so this is static; edit site.author in _config.yml.
     Set author.linkedin there to switch the name from plain text to a link.
     .label is deliberate — the name shares the micro-label voice with the
     eyebrow at the top of the page head. See css/components/byline.css. -->
<div class="byline">
  <img class="byline__portrait"
       src="{{ site.author.portrait }}"
       srcset="{{ site.author.portrait }} 1x, {{ site.author.portrait_2x }} 2x"
       width="48" height="48" loading="lazy" decoding="async"
       alt="{{ site.author.name }}">
  {% if site.author.linkedin %}<a class="byline__name label" href="{{ site.author.linkedin }}" rel="me noopener" target="_blank">{{ site.author.name }}</a>
  {% else %}<span class="byline__name label">{{ site.author.name }}</span>
  {% endif %}
</div>
