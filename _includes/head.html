<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F6F2">
<title>{% if page.browser_title %}{{ page.browser_title }}{% elsif page.title %}{{ page.title | strip_html }} | Bedrock Cyber{% else %}Bedrock Cyber{% endif %}</title>
<meta name="description" content="{{ page.description | default: page.standfirst | default: site.description | strip_newlines }}">
<link rel="alternate" type="application/rss+xml" title="Bedrock Cyber — Writing" href="/feed.xml">

<!-- Favicon. The accent dot on the ink field: the same two tokens the site
     uses everywhere else. SVG first for capable browsers, .ico at the root
     for the ones that ask for /favicon.ico regardless of what is declared. -->
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
{% unless site.local_fonts %}<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
{% endunless %}<link rel="stylesheet" href="/css/bedrock.css">

<!-- Gates the scroll-reveal hidden state. Must stay inline and stay here. -->
<script>document.documentElement.classList.add('js');</script>
