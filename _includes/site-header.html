<div class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="/" aria-label="Bedrock Cyber, home">
      <img src="/assets/logo.png" alt="Bedrock Cyber" width="520" height="75">
    </a>
    <nav class="site-nav" aria-label="Primary">
      {%- for item in site.data.nav.header %}
      <a class="site-nav__link" href="{{ item.url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.label }}</a>
      {%- endfor %}
    </nav>
    <a class="site-nav__link site-nav__cta" href="{{ site.data.nav.cta.url }}">
      <span class="dot" aria-hidden="true"></span>{{ site.data.nav.cta.label }}
    </a>
  </div>
</div>
