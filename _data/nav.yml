# Site navigation, defined once. Header and footer both read this file,
# so the two can never drift apart again. Order here is display order.
# aria-current is applied automatically by comparing each url to page.url.

header:
  - label: Writing
    url: /writing/
  # The page's H1 is "How an engagement works"; the nav label matches its job
  # rather than promising a service catalogue. The /services/ URL is unchanged.
  - label: How it works
    url: /services/
  - label: About
    url: /about/

footer:
  - label: Writing
    url: /writing/
  - label: How it works
    url: /services/
  - label: About
    url: /about/
  # Points at the article, not the old /eu-cyber-resilience-act/ page — that
  # URL still resolves, but it is now a redirect to this one.
  - label: EU Cyber Resilience Act
    url: /writing/eu-cyber-resilience-act-are-you-ready/

cta:
  label: Start a conversation
  url: /contact/
